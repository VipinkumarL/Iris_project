<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrisPass | Registration Complete</title>
    <style>
        :root { --text:#f6fffb; --muted:rgba(246,255,251,.8); --line:rgba(255,255,255,.22); }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top left,rgba(100,255,218,.24),transparent 28%),radial-gradient(circle at bottom right,rgba(145,255,203,.18),transparent 26%),linear-gradient(135deg,#0a2b2d,#108a79,#4bd39e); font-family:"Aptos","Trebuchet MS",sans-serif; color:var(--text); padding:28px; }
        .box { width:min(720px,100%); text-align:center; padding:48px; border-radius:30px; background:rgba(255,255,255,.12); border:1px solid var(--line); box-shadow:0 24px 80px rgba(0,0,0,.25); backdrop-filter:blur(14px); }
        .brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:22px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
        .mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; border:1px solid var(--line); background:rgba(255,255,255,.12); font-weight:700; color:var(--text); }
        h1 { margin:20px 0 10px; font-family:"Cambria","Times New Roman",serif; font-size:clamp(2.2rem,5vw,3.5rem); letter-spacing:-.03em; }
        p { margin:0 0 14px; line-height:1.7; color:var(--muted); }
        svg { width:110px; height:110px; }
        circle, path { fill:none; stroke:white; stroke-width:5; stroke-linecap:round; }
        circle { stroke-dasharray:283; stroke-dashoffset:283; animation:circle-draw 1s forwards; }
        path { stroke-dasharray:80; stroke-dashoffset:80; animation:path-draw .6s .9s forwards; }
        .actions { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:26px; }
        a { display:inline-block; padding:13px 22px; border-radius:14px; text-decoration:none; font-weight:700; }
        .primary { background:white; color:#127761; }
        .secondary { border:1px solid rgba(255,255,255,.26); color:var(--text); background:rgba(255,255,255,.08); }
        @keyframes circle-draw { to { stroke-dashoffset:0; } }
        @keyframes path-draw { to { stroke-dashoffset:0; } }
    </style>
</head>
<body>
    <section class="box">
        <div class="brand"><div class="mark">IP</div>IrisPass Enrollment Complete</div>
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="45"></circle>
            <path d="M30 52 L45 66 L72 34"></path>
        </svg>
        <h1>Registration Complete</h1>
        <p><strong>{{ username }}</strong> now has an iris constellation password on record.</p>
        <p>The biometric profile has been saved successfully. You can log in now, or leave this screen and come back later.</p>
        <div class="actions">
            <a class="primary" href="/login">Continue To Login</a>
            <a class="secondary" href="/register">Register Another User</a>
        </div>
    </section>
</body>
</html>
